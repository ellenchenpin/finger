/* ============ 工具 ============ */
let HIDE=false;   // 隱藏數字（App 每次 render 時同步）
const fmt=n=>HIDE?'••••':'$'+Math.round(n).toLocaleString('en-US');
const fmt2=n=>HIDE?'••••••':'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtK=n=>HIDE?'••':n>=1e6?'$'+(n/1e6).toFixed(1)+'M':n>=1e3?'$'+Math.round(n/1e3)+'K':'$'+Math.round(n);   // $100K … $900K、$1.0M、$1.5M

const TABS=['我的資產','資產細節','未來目標','每月記帳'];
const INCOME_CATS=['薪水','利息','獎金','股票','其他'];
const EXPENSE_CATS=['餐飲','採買','居家','交通','旅行','娛樂','其他'];
const PRI={high:{l:'高',c:'#ef4444'},mid:{l:'中',c:'#fb923c'},low:{l:'低',c:'#facc15'}};

/* ============ 統一資料來源 mockData ============ */
const mockData = {   // 空白範本（無範例資料）
  schema:4, appName:'錢錢💰',
  profile:{nick:'',birth:''}, bonuses:[], holdings:[], fx:32, recurring:[], fireRet:5, fire:{realYear:null},
  accounts:[],
  salary:0,
  allocation:[   // 固定分類（不可刪除）：只能在底下新增子項目
    {id:'c1',label:'必要開銷',locked:true,items:[]},
    {id:'c2',label:'選擇消費',locked:true,items:[]},   // 選擇消費 = 娛樂、旅遊等選擇性開銷
    {id:'c4',label:'投資理財',locked:true,items:[]},
    {id:'c5',label:'未來基金',locked:true,items:[]}],
  history:[], goals:[], wishlist:[], tx:[], archive:[]
};

/* ============ 自動計算 ============ */
const sumBy=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const acctTotal=a=>a.demand+a.hy+a.fixed;           // 帳戶金額 = 子項目加總
const catTotal=c=>sumBy(c.items,i=>i.amt);          // 分配金額 = 子項目加總
const DEAD_RATE=1;          // 活存利率 <1% 視為死水資產
const DEF_M=()=>({demand:{rate:0,exp:'',cap:0},hy:{rate:0,exp:'',cap:0},fixed:{rate:0,exp:'',cap:0}});
const AT=[['demand','活存'],['hy','高利活存'],['fixed','定存']];
function acctInfo(a){   // 年利率、單利、按日計息（實際天數 ÷ 365）、月補給息
  const t=new Date(), dm=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
  let interest=0,mInterest=0,dead=0,def=0,ef=0,mr=0;
  AT.forEach(([k])=>{const v=a[k]||0,m=(a.m&&a.m[k])||{},r=m.rate||0,cap=m.cap||0,base=cap>0?Math.min(v,cap):v;
    if(v>0&&r>0){interest+=base*r/100; mInterest+=base*r/100*dm/365;}
    if(m.ef) ef+=v; if(v>0) mr=Math.max(mr,r);
    if(k==='demand'&&r<DEAD_RATE) dead+=v; else def+=v;});
  return {interest,mInterest,dead,def,ef,tag:mr>=1?'生息':'一般'};
}
function holdVals(h){   // 依交易紀錄重算股數與加權平均成本
  let sh=0,cost=0,div=0;
  [...h.trades].sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{
    if(t.type==='buy'){cost+=t.shares*t.price;sh+=t.shares;}
    else if(t.type==='sell'){const avg=sh?cost/sh:0;cost-=avg*t.shares;sh-=t.shares;}
    else div+=t.amt;});
  const avg=sh>0?cost/sh:0, mv=sh*h.price;
  return {sh,avg,mv,pl:mv-sh*avg,plPct:avg?(h.price/avg-1)*100:0,div};
}
function calcAssets(d){   // 投資 = 股票持股市值（美股 + 台股）
  let demand=0,hy=0,td=0,dead=0,def=0,interest=0,mInterest=0,ef=0,us=0,tw=0;
  d.accounts.forEach(a=>{demand+=a.demand;hy+=a.hy;td+=a.fixed;const i=acctInfo(a);dead+=i.dead;def+=i.def;interest+=i.interest;mInterest+=i.mInterest;ef+=i.ef;});
  (d.holdings||[]).forEach(h=>{const v=holdVals(h).mv; if(h.cur==='USD') us+=v*(d.fx||32); else tw+=v;});
  const cash=demand+hy, fixed=td, invest=us+tw;
  return {demand,hy,td,cash,fixed,invest,us,tw,dead,def,interest,mInterest,ef,growth:invest,total:cash+fixed+invest};
}
const catOf=(d,label)=>catTotal(d.allocation.find(x=>x.label===label)||{items:[]});
const bonusYear=d=>sumBy(d.bonuses||[],b=>b.amt);
const bonusInto=(d,label)=>sumBy(d.bonuses||[],b=>sumBy((b.inj||[]).filter(i=>i.cat===label),i=>b.amt*(i.ratio||0)/100));   // 獎金淨注入某分類的金額（每年）
function fundCalc(d,fund){   // 未來基金達成：月分配 + 獎金淨注入，複利試算
  const contrib=catOf(d,'未來基金')+bonusInto(d,'未來基金')/12;
  return {contrib,months:fund.target>0?simMonths(fund.saved,fund.target,contrib,d.fireRet==null?5:d.fireRet):null};
}
function simMonths(start,target,monthly,ret,maxM=1200){   // 複利試算：幾個月後達標（null = 100 年內達不到）
  if(start>=target) return 0; let b=start; const r=ret/1200;
  for(let i=1;i<=maxM;i++){ b=b*(1+r)+monthly; if(b>=target) return i; }
  return null;
}
const addMonths=n=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth()+n,1);};
const fmtDur=n=>`${Math.floor(n/12)} 年 ${n%12} 個月`;
const ageAt=(d,date)=>{const b=d.profile&&d.profile.birth; if(!b) return null; return Math.floor((date-new Date(b))/31557600000);};
function fireCalc(d,c,o={}){   // 雙軌 FIRE：Lean（必要開銷）/ Real（含娛樂與旅遊）；目標 = 年支出 ÷ 4%
  const ess0=catOf(d,'必要開銷'), ess=o.ess!=null?o.ess:ess0;
  const real0=(d.fire&&d.fire.realYear!=null)?d.fire.realYear:(ess0+catOf(d,'選擇消費'))*12;
  const leisure=o.leisure!=null?o.leisure:Math.max(0,(real0-ess0*12)/12), realYear=(ess+leisure)*12;
  const monthly=o.monthly!=null?o.monthly:catOf(d,'投資理財')+catOf(d,'未來基金');
  const by=o.by!=null?o.by:bonusInto(d,'投資理財')+bonusInto(d,'未來基金');
  const ret=o.ret!=null?o.ret:(d.fireRet==null?5:d.fireRet);
  const mk=yr=>{const target=yr/0.04;return {target,pct:target>0?c.total/target*100:0,months:target>0?simMonths(c.total,target,monthly+by/12,ret):null};};
  const lean=mk(ess*12), real=mk(realYear);
  return {ess,leisure,realYear,monthly,by,ret,lean,real,target:lean.target,pct:lean.pct,months:lean.months};
}
function diagHome(d,c,f){   // 規則式診斷（最多 5 點）
  const out=[], tot=c.total||1, dp=c.dead/tot*100;
  out.push(dp>25?`死水資產佔 ${dp.toFixed(0)}%（${fmt(c.dead)}）偏高：保留緊急預備金後，把多的錢轉進高利活存、定存或投資。`:`死水資產僅 ${dp.toFixed(0)}%，閒置資金控制得不錯。`);
  const mo=f.ess>0?(c.ef>0?c.ef:c.demand+c.hy)/f.ess:null;
  out.push(mo==null?'尚未設定「必要開銷」，無法評估緊急預備金；請到資產細節的月現金分配填入。':mo<3?`緊急預備金只夠 ${mo.toFixed(1)} 個月必要開銷，低於 3–6 個月安全線，先補足再加碼投資。`:mo>12?`緊急預備金高達 ${mo.toFixed(1)} 個月，超過 12 個月的部分可轉去投資。`:`緊急預備金約 ${mo.toFixed(1)} 個月，在安全範圍。`);
  const ym=todayISO().slice(0,7), cur=d.tx.filter(t=>t.date.slice(0,7)===ym);
  const inc=sumBy(cur.filter(t=>t.type==='income'),t=>t.amt), exp=sumBy(cur.filter(t=>t.type==='expense'),t=>t.amt);
  out.push(inc>0?((inc-exp)/inc*100<20?`本月儲蓄率 ${((inc-exp)/inc*100).toFixed(0)}%（收入 ${fmt(inc)}、支出 ${fmt(exp)}），低於 20%，檢視最大的支出分類。`:`本月儲蓄率 ${((inc-exp)/inc*100).toFixed(0)}%，維持得很好。`):'本月還沒有收入記帳，無法計算儲蓄率。');
  const gp=c.growth/tot*100;
  out.push(gp<30?`成長型資產僅 ${gp.toFixed(0)}%，資產成長偏慢，可提高定期定額。`:`成長型資產佔 ${gp.toFixed(0)}%，配置積極；留意單一市場集中風險。`);
  if(f.target<=0) out.push('設定必要開銷後才能計算 FIRE 目標。');
  else if(f.months==null) out.push('以目前投入與報酬率，100 年內無法達成 FIRE，需提高每月投入或降低必要開銷。');
  else if(f.months===0) out.push('已達到 FIRE 目標！');
  else { const m2=simMonths(c.total,f.target,f.monthly+5000+f.by/12,f.ret); out.push(`FIRE 目標 ${fmt(f.target)}，已達成 ${f.pct.toFixed(1)}%；每月多投入 $5,000 約可提早 ${m2!=null&&f.months>m2?fmtDur(f.months-m2):'不到 1 個月'}。`); }
  return out.slice(0,5);
}
function diagDetail(d,c,f){   // 每次畫面更新都依資產細節（現金分配、資產分類、帳戶、持股、獎金）重新產生，最多 5 點
  const out=[], sal=d.salary||0, bal=sal-sumBy(d.allocation,catTotal), inv=catOf(d,'投資理財')+catOf(d,'未來基金'), tot=c.total||1;
  out.push(sal<=0?'【現金流配置】先填入「固定支配」，才能檢視配置比例。':bal<0?`【現金流配置】每月分配超出固定支配 ${fmt(-bal)}，立刻刪減「選擇消費」或調降子項目。`:`【現金流配置】每月餘額 ${fmt(bal)}，立刻設定自動轉帳到投資理財／未來基金；兩者目前佔固定支配 ${(inv/sal*100).toFixed(0)}%（建議 ≥20%）。`);
  const gp=c.growth/tot*100, dp=c.dead/tot*100, dfp=c.def/tot*100, us=c.invest>0?c.us/c.invest*100:0;
  out.push(`【資產配置】成長型 ${gp.toFixed(0)}%、防禦型 ${dfp.toFixed(0)}%、死水 ${dp.toFixed(0)}%。`+(dp>25?'死水偏高，優先把活存多出的錢移到高利活存或定存。':gp<30?'成長型偏低，可用定期定額逐步提高到 30–50%。':'結構均衡，定期再平衡即可。')+(c.invest>0&&(us>80||us<20)?` 持股集中在單一市場（${Math.max(us,100-us).toFixed(0)}%），留意風險。`:''));
  const rate=a=>Math.max(...AT.map(([k])=>(a.m&&a.m[k]&&a.m[k].rate)||0));
  const best=[...d.accounts].sort((x,y)=>rate(y)-rate(x))[0];
  const cand=[...d.accounts].map(a=>({a,v:(a.m&&a.m.demand&&a.m.demand.rate<DEAD_RATE&&!a.m.demand.ef)?a.demand:0})).sort((x,y)=>y.v-x.v)[0];
  const keep=Math.max(0,f.ess*3-c.ef), mv=cand?Math.max(0,cand.v-keep):0;
  out.push(cand&&best&&mv>0&&rate(best)>0?`【帳戶優化】${cand.a.name} 活存 ${fmt(cand.v)} 幾乎零利息，先保留 ${fmt(keep)}（補足 3 個月生活費），其餘 ${fmt(mv)} 轉到 ${best.name}（${rate(best)}%），每年約多 ${fmt(mv*rate(best)/100)}。`:c.ef<=0?'【帳戶優化】在銀行帳戶展開後勾選「緊急預備金」，建議才會精準指出哪些錢可以搬去更高利率的帳戶。':'【帳戶優化】活存配置合理；到各帳戶補上利率，就能比較哪個帳戶最划算。');
  const soon=[], now=Date.now();
  d.accounts.forEach(a=>AT.forEach(([k,l])=>{const e=a.m&&a.m[k]&&a.m[k].exp; if(e&&a[k]>0){const dd=(new Date(e.replace(/-/g,'/'))-now)/86400000; if(dd<=90&&dd>=-7) soon.push(`${a.name}${l}（${fmtDate(e)}）`);}}));
  if(soon.length) out.push(`【帳戶優化】${soon.join('、')} 即將到期，現在就比較續存利率，避免轉成活存。`);
  const bs=d.bonuses||[], nm=new Date().getMonth()+1;
  out.push(bs.length?(()=>{const b=[...bs].sort((x,y)=>((x.month-nm+12)%12)-((y.month-nm+12)%12))[0],nj=b.inj||[];return `【不定期獎金】下一筆${b.name?`「${b.name}」`:''} ${b.month} 月 ${fmt(b.amt)}：`+(nj.length?`依你的設定注入 ${nj.map(i=>`${i.cat||'未選分類'} ${i.ratio||0}%`).join('、')}，其餘留作預備金或獎勵自己。`:`先補足緊急預備金，再將 ${fmt(b.amt*0.5)} 投入未來基金/投資、${fmt(b.amt*0.2)} 留給自己（可在獎金「編輯」設定注入比例）。`);})():'【不定期獎金】尚未設定；在現金分配的「不定期獎金」按編輯新增後，這裡會給出分配建議。');
  return out.slice(0,5);
}
function applyInvest(p,v,date,upd){   // 記帳「投資」→ 記帳明細 + 持股買進 + 扣款帳戶
  const fx=p.fx||32, total=v.total>0?v.total:(v.price*v.shares||0), amt=Math.round(v.cur==='USD'?total*fx:total);
  const price=v.price>0?v.price:(v.shares>0?total/v.shares:0), shares=v.shares>0?v.shares:(price>0?total/price:0), key=v.ticker.trim().toUpperCase();
  const t={id:uid(),date,type:'invest',cat:'投資',item:'買進 '+key,amt,note:v.note||`${key} ${v.cur} ${Math.round(total*100)/100}`};
  let holdings=p.holdings||[];
  if(shares>0){const tr={id:uid(),type:'buy',date,shares,price};
    holdings=holdings.some(h=>h.ticker===key)?holdings.map(h=>h.ticker===key?{...h,price:price||h.price,trades:[...h.trades,tr]}:h):[...holdings,{id:uid(),ticker:key,name:key,cur:v.cur,price,trades:[tr]}];}
  const accounts=upd&&v.acct?p.accounts.map(a=>a.id===v.acct?{...a,demand:Math.max(0,a.demand-amt)}:a):p.accounts;
  return {...p,tx:[...p.tx,t],holdings,accounts};
}
// 每月最後一天開啟 App：自動記錄當月資產（當天重複開啟會更新為最新數字）
function snapMonthEnd(p){
  const t=new Date(); if(t.getFullYear()!==YEAR) return p;
  const m=t.getMonth()+1; if(t.getDate()!==new Date(YEAR,m,0).getDate()) return p;
  const c=calcAssets(p), old=p.history.find(x=>x.m===m);
  if(old&&old.total===c.total&&old.cash===c.cash&&old.fixed===c.fixed&&old.invest===c.invest) return p;
  const r={m,total:c.total,cash:c.cash,fixed:c.fixed,invest:c.invest};
  return {...p,history:[...p.history.filter(x=>x.m!==m),r].sort((a,b)=>a.m-b.m)};
}

/* ============ 日期 / 月結 / 資料升級 ============ */
const pad=n=>String(n).padStart(2,'0');
const todayISO=()=>{const t=new Date();return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;};
const fmtDate=iso=>String(iso||'').replace(/-/g,'/');   // 統一「年/月/日」
// 每月結束後（進入新月份時）：把舊月份的收支整理成「N月收支紀錄」，並清除明細
function archiveOldMonths(p){
  const now=todayISO().slice(0,7), old=p.tx.filter(t=>t.date.slice(0,7)<now);
  if(!old.length) return p;
  const g={}; old.forEach(t=>{const k=t.date.slice(0,7);(g[k]=g[k]||[]).push(t);});
  let arch=[...p.archive];
  Object.entries(g).forEach(([ym,list])=>{
    const ex=arch.find(a=>a.ym===ym)||{ym,income:0,expense:0,inc:{},exp:{}};
    const n={ym,income:ex.income,expense:ex.expense,invest:ex.invest||0,inc:{...ex.inc},exp:{...ex.exp},tx:[...(ex.tx||[])]};
    list.forEach(t=>{if(t.type==='invest') n.invest+=t.amt; else {const o=t.type==='income'?n.inc:n.exp;o[t.cat]=(o[t.cat]||0)+t.amt;if(t.type==='income')n.income+=t.amt;else n.expense+=t.amt;} n.tx.push(t);});
    arch=[...arch.filter(a=>a.ym!==ym),n];
  });
  return {...p,tx:p.tx.filter(t=>t.date.slice(0,7)>=now),archive:arch.sort((a,b)=>b.ym.localeCompare(a.ym))};
}
const LOCKED=['必要開銷','選擇消費','投資理財','未來基金'];   // 固定分類：不可刪除，只能新增子項目
function ensureAlloc(st){
  const al=st.allocation.map(c=>LOCKED.includes(c.label)?{...c,locked:true}:c);
  LOCKED.forEach(n=>{ if(!al.some(c=>c.label===n)) al.push({id:uid(),label:n,locked:true,items:[]}); });
  const n={...st,salary:st.salary==null?0:st.salary,allocation:al,accounts:st.accounts.map(a=>{const m=a.m||DEF_M(),m2={};Object.keys(m).forEach(k=>{const e=m[k].exp;m2[k]={...m[k],exp:e&&e.length===7?`${e}-${pad(new Date(+e.slice(0,4),+e.slice(5),0).getDate())}`:e};});return {...a,m:m2};}),profile:st.profile||{nick:'',birth:''},bonuses:(st.bonuses||[]).map(b=>{const nb={name:'',...b};if(!nb.inj)nb.inj=nb.cat?[{id:uid(),cat:nb.cat,ratio:nb.ratio||0}]:[];delete nb.cat;delete nb.ratio;return nb;}),holdings:st.holdings||[],fx:st.fx||32,recurring:st.recurring||[],fireRet:(st.fireRet==null||st.fireRet===6)?5:st.fireRet,fire:st.fire||{realYear:null},tx:(st.tx||[]).map(t=>t.cat==='投資'&&t.type==='expense'?{...t,type:'invest'}:t)};

function summarize(tx){
  const inc={},exp={}; let income=0,expense=0,invest=0;

  return {income,expense,invest,inc,exp};

function CalcPad({cfg,onClose}) {
  const [ex,setEx]=useState(cfg.value?String(cfg.value):'');
  const ev=e=>{const q=e.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-'); if(!q||!/^[\d+\-*/().\s]+$/.test(q)) return null; try{const r=Function('"use strict";return ('+q+')')(); return isFinite(r)?Math.round(r*100)/100:null;}catch(x){return null;}};
  const press=k=>{ if(k==='C') setEx(''); else if(k==='⌫') setEx(e=>e.slice(0,-1)); else if(k==='=') {const r=ev(ex); if(r!=null) setEx(String(r));} else setEx(e=>e+k); };
  const done=()=>{ if(!ex.trim()){cfg.onChange(0);onClose();return;} const r=ev(ex); if(r!=null){cfg.onChange(Math.max(0,r));onClose();} };
  const keys=['C','⌫','÷','×','7','8','9','−','4','5','6','+','1','2','3','=','0','.','00'];
  const hasOp=/[+\-−×÷]/.test(ex.slice(1)), pv=hasOp?ev(ex):null;
  return (<div className="fixed inset-0 z-[60] bg-black/30 flex items-end justify-center px-3" style={{paddingBottom:'calc(38px + env(safe-area-inset-bottom,0px))'}} onClick={onClose}>
    <div className="bg-white w-full max-w-[393px] rounded-2xl p-4" onClick={e=>e.stopPropagation()}>
      <div className="text-right text-2xl font-semibold h-9 overflow-hidden">{ex?ex.replace(/\d+(\.\d+)?/g,m=>addCommas(m)):'0'}</div>
      <div className="text-right text-xs text-zinc-400 h-5">{pv!=null?'= '+addCommas(String(pv)):''}</div>
      <div className="grid grid-cols-4 gap-2 mt-2">
        {keys.map(k=><button key={k} onClick={()=>press(k)} className={`h-12 rounded-lg text-lg font-medium ${/[÷×−+=]/.test(k)?'bg-neutral-200':'bg-neutral-100'}`}>{k}</button>)}
        <button onClick={done} className="h-12 rounded-lg text-sm font-semibold bg-black text-white">完成</button>
      </div>
    </div></div>);
}

    <Card className="flex-1 p-3 min-w-0"><div className={`text-sm font-semibold leading-5 mb-2 ${color}`}>{title}</div>
      {rows.map(r=><div key={r.c} className="grid grid-cols-[3.4em_1fr_30px] gap-2 h-[25px] items-center text-xs">
        <Fit className="font-semibold">{r.c}</Fit><Fit className="font-medium text-zinc-500 min-w-0">{r.v?fmt(r.v):'-'}</Fit><span className="font-medium text-zinc-500 text-right">{r.v?r.p+'%':'-'}</span></div>)}
    </Card>);
  const RC='grid grid-cols-[8px_70px_46px_1fr_62px_24px] gap-2 px-2.5 items-center';
  return (<div className="px-4 pt-[17px] flex flex-col gap-3">
    <Card className="h-[102px] px-4 grid grid-cols-3 gap-2 items-center">
      <div className="min-w-0"><div className="text-sm font-semibold leading-5">本月總收入</div><Fit className="text-lg font-semibold leading-8 text-green-700 mt-2">{fmt(tI)}</Fit></div>
      <div className="min-w-0"><div className="text-sm font-semibold leading-5">本月總支出</div><Fit className="text-lg font-semibold leading-8 text-red-600 mt-2">{fmt(tE)}</Fit></div>
      <div className="min-w-0"><div className="text-sm font-semibold leading-5">本月投資</div><Fit className="text-lg font-semibold leading-8 text-purple-600 mt-2">{fmt(tV)}</Fit></div>
    </Card>
    <div className="flex gap-3"><Stat title="收入統計" color="text-green-700" rows={iRows}/><Stat title="支出統計" color="text-red-600" rows={eRows}/></div>
    <div className="mt-2">
      <div className={`${RC} h-7 border-b-[0.5px] border-neutral-300 text-xs font-semibold text-zinc-500`}><span/><span className="text-center">日期</span><span>分類</span><span>項目</span><span>金額</span><span>備註</span></div>
      {!cur.length&&<div className="text-xs text-zinc-400 text-center py-6">本月尚無收支，按下方「+」新增</div>}
      {cur.map(t=>(
        <SwipeRow key={t.id} open={openId&&openId.id===t.id?openId.side:null} onOpen={side=>setOpenId({id:t.id,side})} onClose={()=>setOpenId(null)} onEdit={()=>{setOpenId(null);onEdit(t);}}>
          <div className={`${RC} h-[37px] text-xs font-medium`}>
            <i className={`w-[5px] h-[5px] rounded-full ${t.type==='income'?'bg-green-500':t.type==='invest'?'bg-purple-500':'bg-red-500'}`}/>
            <Fit className="min-w-0 text-center">{fmtDate(t.date)}</Fit><Fit className="min-w-0">{t.cat}</Fit><Fit className="min-w-0">{t.item}</Fit><Fit className="min-w-0">{fmt(t.amt)}</Fit>
            <button onClick={e=>{e.stopPropagation();onInfo(t);}} aria-label="備註" className={`w-4 h-4 rounded-full text-white text-[11px] font-bold flex items-center justify-center ${t.note?'bg-blue-500':'bg-neutral-300'}`}>i</button>
          </div>
        </SwipeRow>))}
    </div>
    <button onClick={()=>setHist(true)} className="mt-4 h-12 px-4 w-full flex items-center justify-between rounded-lg border border-neutral-200 bg-white">
      <span className="text-sm font-semibold">歷史紀錄</span>
      <span className="flex items-center gap-1 text-xs text-zinc-500">{d.archive.length} 個月<Chev/></span>
    </button>
    <div style={{height:'calc(76px + env(safe-area-inset-bottom,0px))'}}/>
    {hist&&<Sheet title="歷史紀錄" onClose={()=>setHist(false)}>
      <div className="text-[10px] text-zinc-400 mb-1">長按月份或逐筆明細可刪除</div>
      {!d.archive.length&&<div className="text-xs text-zinc-400 py-4 whitespace-normal leading-5">尚無歷史紀錄。每月結束後，當月的收支會自動移到這裡保留，可查閱逐筆明細。</div>}
      {d.archive.map(a=><ArchiveRow key={a.ym} a={a} onDelMonth={delMonth} onDelTx={delArcTx}/>)}
    </Sheet>}
  </div>);
}
function TxForm({init,accounts,onSave,onInvest,onDelete,onClose}) {
  const [date,setDate]=useState(init.date), [type,setType]=useState(init.type), [cat,setCat]=useState(init.cat), [item,setItem]=useState(init.item), [amt,setAmt]=useState(init.amt), [note,setNote]=useState(init.note||'');
  const [ticker,setTicker]=useState(''), [cur,setCur]=useState('TWD'), [price,setPrice]=useState(0), [shares,setShares]=useState(0), [total,setTotal]=useState(0), [acct,setAcct]=useState(''), [rec,setRec]=useState(false), [day,setDay]=useState(5);
  const cats=type==='income'?INCOME_CATS:type==='invest'?['投資']:EXPENSE_CATS;
  const isInv=!onDelete&&type==='invest';
  const invOk=ticker.trim()&&acct&&(total>0||(price>0&&shares>0));
  const pick=k=>{setType(k);setCat(k==='income'?'薪水':k==='invest'?'投資':'餐飲');};
  const L=(t,ch)=><div><div className="text-xs text-zinc-500 mb-1">{t}</div>{ch}</div>;
  const nb="w-full h-10 px-3 text-sm text-left", sel="h-10 w-full rounded-lg border border-neutral-200 px-3 text-sm bg-white";
  const save=()=>{ if(isInv) onInvest({date,ticker:ticker.trim(),cur,price,shares,total,acct,rec,day,note}); else onSave({date,type,cat,item:item.trim()||cat,amt,note}); onClose(); };
  return (<Sheet title={onDelete?'編輯記帳':'新增記帳'} onClose={onClose}>
    <div className="flex flex-col gap-3">
      <div className="flex gap-2">{[['expense','支出','#ef4444'],['income','收入','#22c55e'],['invest','投資','#7c3aed']].map(([k,l,col])=><Pill key={k} full on={type===k} color={col} tc="#fff" onClick={()=>pick(k)}>{l}</Pill>)}</div>
      <div><div className="text-xs text-zinc-500 mb-1">日期</div><DateBox value={date} onChange={setDate}/></div>
      {!isInv&&<select value={cat} onChange={e=>setCat(e.target.value)} className={sel}>{cats.map(c=><option key={c}>{c}</option>)}</select>}
      {isInv?<>
        {L('股票代號（必填）',<Txt value={ticker} onChange={setTicker} ph="例如 0050、AAPL" className="h-10 w-full"/>)}
        {L('幣別',<select value={cur} onChange={e=>setCur(e.target.value)} className={sel}><option value="TWD">NT（台幣）</option><option value="USD">USD（美元）</option></select>)}
        {L('股價（選填）',<NumBox value={price} onChange={setPrice} className={nb}/>)}
        {L('股數（選填）',<NumBox value={shares} onChange={setShares} className={nb}/>)}
        {L('總額（選填；股價×股數可自動算）',<NumBox value={total} onChange={setTotal} className={nb}/>)}
        {L('扣款帳戶（必選）',<select value={acct} onChange={e=>setAcct(e.target.value)} className={sel}><option value="">請選擇</option>{accounts.map(a=><option key={a.id} value={a.id}>{a.name}</option>)}</select>)}
        <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={rec} onChange={e=>setRec(e.target.checked)}/>定期定額，每月
          <select value={day} onChange={e=>setDay(+e.target.value)} disabled={!rec} className="h-9 rounded-lg border border-neutral-200 px-2 bg-white">{Array.from({length:28},(_,i)=>i+1).map(n=><option key={n} value={n}>{n}</option>)}</select>號 (提醒自動記載)</label>
      </>:<>
        <Txt value={item} onChange={setItem} ph="項目名稱" className="h-10 w-full"/>
        <NumBox value={amt} onChange={setAmt} className={nb}/>
      </>}
      <Txt value={note} onChange={setNote} ph="備註（選填）" className="h-10 w-full"/>
      <SaveBtn disabled={isInv?!invOk:(!(amt>0)||!date)} onClick={save}/>
      {onDelete&&<button onClick={()=>{if(confirm('刪除這筆記帳？')){onDelete();onClose();}}} className="h-11 rounded-lg border border-neutral-200 text-sm font-medium text-red-600">刪除這筆</button>}
    </div>
  </Sheet>);
}

/* ============ Google 登入畫面 ============ */
function LoginScreen() {
  const [err,setErr]=useState('');
  const login=()=>{
    setErr('');
    const provider=new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(e=>{
      if(e.code==='auth/popup-blocked') return auth.signInWithRedirect(provider);
      if(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request') return;
      setErr(e.code==='auth/unauthorized-domain'?'此網址尚未加入 Firebase 的已授權網域':'登入失敗：'+e.code);
    });
  };
  return (<div className="fixed inset-0 z-50 bg-white flex flex-col items-center justify-center gap-4 px-8 text-center">
    <h1 className="text-xl font-semibold m-0">錢錢💰</h1>
    <p className="text-sm text-zinc-500 m-0 whitespace-normal">登入後，你的資料會存到雲端，換裝置也能看到。</p>
    <button onClick={login} className="h-11 px-6 rounded-lg bg-black text-white text-sm font-medium">使用 Google 登入</button>
    {err&&<p className="text-xs text-red-600 m-0 whitespace-normal">{err}</p>}
  </div>);
}

/* ============ App ============ */
function App() {
  const [d,setD]=useState(mockData);
  const [tab,setTab]=useState(0);
  const [hide,setHide]=useState(()=>{try{return localStorage.getItem('hide')==='1';}catch(e){return false;}});
  const [menu,setMenu]=useState(false), [profile,setProfile]=useState(false), [calcCfg,setCalcCfg]=useState(null);
  const [txForm,setTxForm]=useState(null);   // {tx?}
  const [info,setInfo]=useState(null);
  const [,setTick]=useState(0);
  const [ready,setReady]=useState(!CONFIGURED);
  const [authState,setAuthState]=useState(CONFIGURED?'loading':'in');
  const [sync,setSync]=useState(CONFIGURED?'連線中…':'離線模式（尚未設定 Firebase）');
  const docRef=useRef(null), dirty=useRef(false), skip=useRef(false), seq=useRef(0);
  HIDE=hide; OPEN_CALC=setCalcCfg;
  useEffect(()=>{ if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>setTick(t=>t+1)); },[]);
  const toggleHide=()=>setHide(h=>{const n=!h;try{localStorage.setItem('hide',n?'1':'0');}catch(e){}return n;});

  // 監聽登入狀態：登入後讀取並即時監聽 users/{uid}/app/data
  useEffect(()=>{
    if(!CONFIGURED) return; let unsub=null;
    const off=auth.onAuthStateChanged(user=>{
      if(unsub){ unsub(); unsub=null; }
      if(!user){ docRef.current=null; dirty.current=false; skip.current=false; setReady(false); setD(mockData); setAuthState('out'); setSync('尚未登入'); return; }
      setAuthState('in'); setSync('連線中…');
      docRef.current=db.collection('users').doc(user.uid).collection('app').doc('data');
      unsub=docRef.current.onSnapshot(snap=>{
        if(dirty.current||snap.metadata.hasPendingWrites) return;
        if(snap.exists){ const st=JSON.parse(snap.data().json); const mg=migrate(st); if(mg){ skip.current=true; setD(mg); if(mg!==st) docRef.current.set({json:JSON.stringify(mg)}); } else docRef.current.set({json:JSON.stringify(mockData)}); }  // 舊版資料自動升級
        else docRef.current.set({json:JSON.stringify(mockData)});
        setReady(true); setSync('已同步');
      },err=>setSync('同步失敗：'+err.code));
    });
    return ()=>{ off(); unsub&&unsub(); };
  },[]);
  // 資料變動 → 0.5 秒後寫入 Firestore
  useEffect(()=>{
    if(!ready||!docRef.current) return;
    if(skip.current){ skip.current=false; return; }
    dirty.current=true; setSync('儲存中…');
    const t=setTimeout(()=>{
      const n=++seq.current;
      docRef.current.set({json:JSON.stringify(d)}).then(()=>{ if(n===seq.current){ dirty.current=false; setSync('已同步'); } })
        .catch(err=>setSync('儲存失敗：'+err.code));
    },500);
    return ()=>clearTimeout(t);
  },[d,ready]);

  const fund=useMemo(()=>{const target=sumBy(d.goals,g=>g.budget),saved=sumBy(d.goals,g=>g.saved);return {target,saved,rate:target?saved/target*100:0};},[d.goals]);
  const calc=useMemo(()=>calcAssets(d),[d]);
  const mom=useMemo(()=>{   // 較上月成長：與上個月的紀錄比較
    const t=new Date(), pm=t.getFullYear()===YEAR?t.getMonth():0, r=d.history.find(x=>x.m===pm);
    const g=(cur,prev)=>(r&&prev)?(cur-prev)/prev*100:null;
    return {total:g(calc.total,r&&r.total),cash:g(calc.cash,r&&r.cash),fixed:g(calc.fixed,r&&r.fixed),invest:g(calc.invest,r&&r.invest)};
  },[d,calc]);
  useEffect(()=>{ if(ready) setD(p=>snapMonthEnd(p)); },[ready,calc.total,calc.cash,calc.fixed,calc.invest]);
  useEffect(()=>{ if(ready) setD(p=>archiveOldMonths(p)); },[ready,d.tx]);   // 月結：整理上月收支並清除明細

  const saveTx=(t,id)=>setD(p=>id?{...p,tx:p.tx.map(x=>x.id===id?{...x,...t}:x)}:{...p,tx:[...p.tx,{...t,id:uid()}]});
  const delTx=id=>setD(p=>({...p,tx:p.tx.filter(x=>x.id!==id)}));
  const saveInvest=v=>{ const upd=confirm('已記錄。是否同步更新扣款銀行帳戶（從活存扣除）？');
    setD(p=>{ let n=applyInvest(p,v,v.date,upd); if(v.rec) n={...n,recurring:[...(n.recurring||[]),{id:uid(),ticker:v.ticker,cur:v.cur,price:v.price,shares:v.shares,total:v.total,acct:v.acct,day:v.day,lastYM:v.date.slice(0,7)}]}; return n; }); };
  const recDone=useRef(false);
  useEffect(()=>{   // 定期定額：到期日提醒是否自動記載
    if(!ready||recDone.current) return; recDone.current=true;
    const ym=todayISO().slice(0,7), day=new Date().getDate();
    (d.recurring||[]).forEach(r=>{ if(r.lastYM!==ym&&day>=r.day){
      const ok=confirm(`定期定額提醒：本月 ${r.day} 號 ${r.ticker} 扣款，是否自動記載？`);
      setD(p=>{ const n=ok?applyInvest(p,r,todayISO(),true):p; return {...n,recurring:n.recurring.map(x=>x.id===r.id?{...x,lastYM:ym}:x)}; }); } });
  },[ready]);
  const blank={date:todayISO(),type:'expense',cat:'餐飲',item:'',amt:0,note:''};

  return (<div className="relative w-full max-w-[393px] mx-auto min-h-screen bg-white overflow-hidden" style={{paddingTop:'env(safe-area-inset-top,0px)'}}>
    <header className="h-14 relative flex items-center justify-center mt-[19px]">
      <button onClick={()=>setProfile(true)} className="absolute left-4 w-6 h-6 flex flex-col justify-center gap-[6px] px-[3px]" aria-label="選單"><i className="block h-0.5 bg-black w-4"/><i className="block h-0.5 bg-black w-3.5"/><i className="block h-0.5 bg-black w-4"/></button>
      <h1 className="text-xl font-semibold leading-7 m-0">{d.profile&&d.profile.nick?d.profile.nick+'的錢錢💰':'錢錢💰'}</h1>
      <div className="absolute bottom-0 inset-x-0 text-center text-[10px] leading-3 text-zinc-400">{sync}</div>
      <button onClick={toggleHide} aria-label={hide?'顯示數字':'隱藏數字'} className="absolute right-4 w-6 h-6 flex items-center justify-center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>{hide&&<path d="M3 3l18 18"/>}</svg>
      </button>
    </header>
    {menu&&<div className="fixed inset-0 z-30" onClick={()=>setMenu(false)}>
      <div className="absolute left-4 bg-white border border-neutral-200 rounded-lg shadow-lg p-2 text-sm" style={{top:'calc(env(safe-area-inset-top,0px) + 75px)'}} onClick={e=>e.stopPropagation()}>
        {CONFIGURED&&auth.currentUser&&<div className="px-3 py-1 text-xs text-zinc-500">{auth.currentUser.email}</div>}
        {CONFIGURED?<button onClick={()=>{setMenu(false);auth.signOut();}} className="px-3 py-2 w-full text-left font-medium">登出</button>:<div className="px-3 py-2 text-zinc-500">尚未設定 Firebase</div>}
      </div></div>}
    <nav className="flex gap-3 px-4 mt-3 overflow-x-auto no-sb">
      {TABS.map((t,i)=><button key={t} onClick={()=>setTab(i)} className={`px-3.5 py-1.5 rounded-[20px] text-sm font-medium leading-5 transition-colors ${tab===i?'bg-black text-white':'bg-neutral-100 text-black'}`}>{t}</button>)}
    </nav>
    {!ready&&<div className="py-24 text-center text-sm text-zinc-500">載入中…</div>}
    <main key={tab} style={{animation:'fade .18s ease-out',display:ready?'block':'none'}}>
      {tab===0&&<PageMy d={d} setD={setD} fund={fund} c={calc} mom={mom}/>}
      {tab===1&&<PageDetail d={d} setD={setD} c={calc} mom={mom}/>}
      {tab===2&&<CalcCtx.Provider value={true}><PageGoals d={d} setD={setD} fund={fund}/></CalcCtx.Provider>}
      {tab===3&&<PageLedger d={d} setD={setD} onEdit={t=>setTxForm({tx:t})} onInfo={setInfo}/>}
    </main>
    <button onClick={()=>ready&&setTxForm({})} aria-label="新增記帳" className="fixed z-20 w-12 h-12 rounded-full bg-black text-white text-2xl leading-none shadow-lg" style={{left:'max(16px,calc(50% - 180px))',bottom:'max(20px,env(safe-area-inset-bottom))'}}>+</button>
    {txForm&&<TxForm init={txForm.tx||blank} accounts={d.accounts} onInvest={saveInvest} onSave={t=>saveTx(t,txForm.tx&&txForm.tx.id)} onDelete={txForm.tx?()=>delTx(txForm.tx.id):null} onClose={()=>setTxForm(null)}/>}
    {info&&<Sheet title="記帳詳情" onClose={()=>setInfo(null)}>
      <div className="text-sm leading-7">
        <div>日期：{fmtDate(info.date)}</div><div>分類：{info.cat}</div><div>項目：{info.item}</div><div>金額：{fmt(info.amt)}</div>
        <div className="whitespace-pre-wrap break-words">備註：{info.note||'（無）'}</div>
      </div>
    </Sheet>}
    {profile&&<Sheet title="個人資訊" onClose={()=>setProfile(false)}><div className="flex flex-col gap-3">
      <div><div className="text-xs text-zinc-500 mb-1">暱稱</div><Txt value={d.profile.nick} onChange={v=>setD(p=>({...p,profile:{...p.profile,nick:v}}))} ph="你的暱稱" className="h-10 w-full"/></div>
      <div><div className="text-xs text-zinc-500 mb-1">生日（用來計算 FIRE 達成年齡）</div><DateBox clearable value={d.profile.birth} onChange={v=>setD(p=>({...p,profile:{...p.profile,birth:v}}))}/></div>
      {CONFIGURED&&auth.currentUser&&<div className="text-xs text-zinc-500">{auth.currentUser.email}</div>}
      <button onClick={()=>{if(confirm('清空所有資料（帳戶、記帳、目標、持股…）？此動作無法復原。')){setD(p=>({...mockData,profile:p.profile}));setProfile(false);}}} className="h-11 rounded-lg border border-neutral-200 text-sm font-medium text-red-600">清空所有資料</button>
      {CONFIGURED&&<button onClick={()=>{setProfile(false);auth.signOut();}} className="h-11 rounded-lg border border-neutral-200 text-sm font-medium">登出</button>}
    </div></Sheet>}
    {calcCfg&&<CalcPad cfg={calcCfg} onClose={()=>setCalcCfg(null)}/>}
    {CONFIGURED&&authState==='out'&&<LoginScreen/>}
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
