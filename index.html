/* ============ 工具 ============ */
let HIDE=false;   // 隱藏數字（App 每次 render 時同步）

const fmt2=n=>HIDE?'••••••':'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

/* ============ 統一資料來源 mockData ============ */
const mockData = {   // 空白範本（無範例資料）
  schema:6, appName:'錢錢💰',
  profile:{nick:'',birth:''}, bonuses:[], holdings:[], fx:32, recurring:[], fireRet:5, fire:{realYear:null},
  accounts:[],
  salary:0,
  allocation:[   // 固定分類（不可刪除）：只能在底下新增子項目
    {id:'c1',label:'必要開銷',locked:true,items:[]},
    {id:'c2',label:'選擇消費',locked:true,items:[]},   // 選擇消費 = 娛樂、旅遊等選擇性開銷
    {id:'c4',label:'投資理財',locked:true,items:[]},
    {id:'c5',label:'未來基金',locked:true,items:[]}],
  history:[], goals:[], wishlist:[], tx:[], archive:[]
};

/* ============ 自動計算 ============ */
const sumBy=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const acctTotal=a=>a.demand+a.fixed;           // 帳戶金額 = 子項目加總
const catTotal=c=>sumBy(c.items,i=>i.amt);          // 分配金額 = 子項目加總
const DEAD_RATE=1;          // 活存年利率 <1% = 一般活存（死水資產）；≥1% = 系統判定為高利活存
const DEF_M=()=>({demand:{rate:0,exp:'',cap:0},fixed:{rate:0,exp:'',cap:0}});
const AT=[['demand','活存'],['fixed','定存']];
function acctInfo(a){   // 年利率、單利、按日計息（實際天數 ÷ 365）、月補給息
  const t=new Date(), dm=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
  let interest=0,mInterest=0,dead=0,def=0,ef=0,mr=0;
  AT.forEach(([k])=>{const v=a[k]||0,m=(a.m&&a.m[k])||{},r=m.rate||0,cap=m.cap||0,base=cap>0?Math.min(v,cap):v;
    if(v>0&&r>0){interest+=base*r/100; mInterest+=base*r/100*dm/365;}
    if(m.ef) ef+=v; if(v>0) mr=Math.max(mr,r);
    if(k==='demand'&&r<DEAD_RATE) dead+=v; else def+=v;});
  return {interest,mInterest,dead,def,ef,tag:mr>=1?'生息':'普通'};
}
function holdVals(h){   // 依交易紀錄（日期、輸入先後）逐筆重算；成本含買進手續費；賣出 = 扣手續費與交易稅後的淨額
  const ts=h.trades.map((t,i)=>[t,i]).sort((a,b)=>a[0].date.localeCompare(b[0].date)||a[1]-b[1]).map(x=>x[0]);
  let sh=0,cost=0,div=0,realized=0,oversold=false;
  ts.forEach(t=>{
    if(t.type==='buy'){ cost+=t.shares*t.price+(t.fee||0); sh+=t.shares; }
    else if(t.type==='sell'){
      const q=Math.min(t.shares,sh); if(t.shares>sh+1e-9) oversold=true;          // 賣出不可超過當時持有股數
      const avg=sh>0?cost/sh:0, net=t.shares*t.price-(t.fee||0)-(t.tax||0);
      realized+=(t.shares>0?net*q/t.shares:0)-avg*q;                               // 已實現損益 = 淨收入 − 平均成本 × 賣出股數
      cost-=avg*q; sh-=q; if(sh<1e-9){sh=0;cost=0;}
    } else div+=t.amt;
  });
  const avg=sh>0?cost/sh:0, mv=sh*h.price, pl=mv-cost;                             // 未實現損益 = 市值 − 剩餘成本
  return {sh,avg,cost,mv,pl,plPct:cost>0?pl/cost*100:0,realized,div,oversold};
}
function calcAssets(d){   // 投資 = 股票持股市值（美股 + 台股）
  let demand=0,hy=0,td=0,dead=0,def=0,interest=0,mInterest=0,ef=0,us=0,tw=0;
  d.accounts.forEach(a=>{const r=(a.m&&a.m.demand&&a.m.demand.rate)||0; if(r>=DEAD_RATE) hy+=a.demand; else demand+=a.demand; td+=a.fixed;const i=acctInfo(a);dead+=i.dead;def+=i.def;interest+=i.interest;mInterest+=i.mInterest;ef+=i.ef;});
  (d.holdings||[]).forEach(h=>{const v=holdVals(h).mv; if(h.cur==='USD') us+=v*(d.fx||32); else tw+=v;});
  const cash=demand+hy, fixed=td, invest=us+tw;
  return {demand,hy,td,cash,fixed,invest,us,tw,dead,def,interest,mInterest,ef,growth:invest,total:cash+fixed+invest};
}
const catOf=(d,label)=>catTotal(d.allocation.find(x=>x.label===label)||{items:[]});
const bonusYear=d=>sumBy(d.bonuses||[],b=>b.amt);
const bonusInjAll=d=>sumBy(d.bonuses||[],b=>b.amt*Math.min(100,sumBy(b.inj||[],i=>i.ratio||0))/100);   // 獎金已指定去處的金額（每年）
const annualInfo=(d,nb)=>{const bonus=nb?0:bonusYear(d), al=sumBy(d.allocation,catTotal)*12+(nb?0:bonusInjAll(d)), inc=(d.salary||0)*12+bonus; return {inc,bonus,al,free:inc-al};};   // 年薪=月薪×12+預期獎金；free=年度未分配
const bonusInto=(d,label)=>sumBy(d.bonuses||[],b=>sumBy((b.inj||[]).filter(i=>i.cat===label),i=>b.amt*(i.ratio||0)/100));   // 獎金淨注入某分類的金額（每年）
function fundCalc(d,fund){   // 未來基金達成：月分配 + 獎金淨注入，複利試算
  const contrib=catOf(d,'未來基金')+bonusInto(d,'未來基金')/12;
  return {contrib,months:fund.target>0?simMonths(fund.saved,fund.target,contrib,d.fireRet==null?5:d.fireRet):null};
}
// FIRE 專用：全部以「今日幣值」計算。報酬用實質年化報酬率複利（月利率 = (1+r)^(1/12)−1）；
// 每月投入與年獎金是固定名目金額，第 k 個月的購買力 = 金額 ÷ (1+通膨)^(k/12)，折算成今日幣值後才加入
function simFire(start,target,monthly,by,rr,infl,maxM=1200){
  if(start>=target) return 0;
  const rm=Math.pow(1+Math.max(rr,-99)/100,1/12)-1, dm=Math.pow(1+Math.max(infl,-99)/100,-1/12), c=monthly+by/12;
  let b=start, df=1;
  for(let i=1;i<=maxM;i++){ df*=dm; b=b*(1+rm)+c*df; if(b>=target) return i; }
  return null;
}
// 兩個口袋：存款（用帳戶利率成長）＋股票（情境報酬率成長，每月投入與獎金也進這一邊）；兩邊加總達到目標即達成
function simFire2(dep,stk,target,monthly,by,rrD,rrS,infl,maxM=1200,gp){   // gp：有日期的未來目標（見 goalPlan）；沒有則與舊算法完全相同
  const g=r=>Math.pow(1+Math.max(r,-99)/100,1/12)-1, rd=g(rrD), rs=g(rrS), dm=Math.pow(1+Math.max(infl,-99)/100,-1/12), c=monthly+by/12, G=gp||[];
  let pend=sumBy(G,q=>q.out);   // 還沒支付的目標預算：達成 FIRE 時也要能付得起
  if(dep+stk-pend>=target) return 0;
  let df=1;
  for(let i=1;i<=maxM;i++){ df*=dm; dep*=1+rd; stk=stk*(1+rs)+c*df;
    for(const q of G){
      const sa=q.sched&&q.sched[i]; if(sa>0){ const a=sa*df; if(q.place==='invest') stk+=a; else dep+=a; }   // 目標每月存入的金額（依序填滿），依現金／投資進對應口袋
      if(i===q.m){ let o=q.out;   // 到期付款：先從自己的口袋付，不夠再付另一邊；實際付出多少，待支付就只減少多少（付不出的部分仍留在 pend）
        const A1=q.place==='invest'?stk:dep, A2=q.place==='invest'?dep:stk, t1=Math.min(A1,o); o-=t1; const t2=Math.min(A2,o); o-=t2;
        if(q.place==='invest'){ stk-=t1; dep-=t2; } else { dep-=t1; stk-=t2; }
        pend-=q.out-o; } }
    if(dep+stk-pend>=target) return i; }
  return null;
}
// 未來目標 × FIRE：「未來基金」是一個池子，金額 = 「未來基金出金帳戶」的活存餘額（沒指定帳戶 = 0），不需手動輸入。
// 系統依 優先級→使用日期 把它依序分給各目標（不需要手動填每項金額），有預計使用時間的目標才參與 FIRE 試算
const poolOf=d=>{ const a=(d.accounts||[]).find(x=>x.id===d.fundPayAcct); return a?Math.max(0,a.demand||0):0; };
const goalCmp=(a,b)=>({high:0,mid:1,low:2}[a.pri]??1)-({high:0,mid:1,low:2}[b.pri]??1) || ((a.date||'9999')<(b.date||'9999')?-1:(a.date||'9999')>(b.date||'9999')?1:0);
function goalAlloc(d){ const act=[...(d.goals||[])].filter(g=>!g.done).sort(goalCmp), pool=poolOf(d), al={}; let left=pool;
  act.forEach(g=>{ const a=Math.min(left,Math.max(0,g.budget||0)); al[g.id]=a; left-=a; }); return {act,al,pool,left}; }
const goalMonths=g=>{ if(!g||!/^\d{4}-\d{2}-\d{2}$/.test(g.date||'')) return null; const t=new Date(); const m=(+g.date.slice(0,4)-t.getFullYear())*12+(+g.date.slice(5,7)-(t.getMonth()+1)); return m>=1&&m<=1200?m:null; };
function goalPlan(d,cfg){
  const A=goalAlloc(d), base=catOf(d,'未來基金'), cm=new Date().getMonth()+1;   // 每月分配 + 獎金在「入帳月」一次進池子（每年重複）
  const lump=t=>cfg.noBonus?0:sumBy(d.bonuses||[],b=>(((cm-1+t)%12)+1)===+b.month?sumBy((b.inj||[]).filter(i=>i.cat==='未來基金'),i=>b.amt*(i.ratio||0)/100):0);
  const contrib=base+(cfg.noBonus?0:bonusInto(d,'未來基金')/12);   // 平均值：只給舊的總覽用
  const rem={}, info={}; let dated=0;
  A.act.forEach(g=>{ rem[g.id]=Math.max(0,(g.budget||0)-(A.al[g.id]||0)); const m=goalMonths(g); if(m!=null){ info[g.id]={g,m,sched:new Array(m+1).fill(0)}; dated+=A.al[g.id]||0; } });
  const maxM=Math.max(0,...Object.values(info).map(x=>x.m));
  if(base>0||(!cfg.noBonus&&bonusInto(d,'未來基金')>0)) for(let t=1;t<=maxM;t++){ let amt=base+lump(t);   // 每月新存入的錢，也依 優先級→日期 依序填滿；已到期支付的目標不再收錢
    for(const g of A.act){ if(amt<=0) break; if(!(rem[g.id]>0)) continue; const x=info[g.id]; if(x&&t>x.m) continue;
      const give=Math.min(rem[g.id],amt); rem[g.id]-=give; amt-=give; if(x) x.sched[t]+=give; } }
  const parts=A.act.filter(g=>info[g.id]).map(g=>({id:g.id,name:g.name,date:g.date,m:info[g.id].m,out:g.budget||0,place:g.place==='invest'?'invest':'cash',saved:A.al[g.id]||0,sched:info[g.id].sched}));
  return {parts,exSaved:Math.max(0,A.pool-dated),contrib,pool:A.pool,A};
}
const depRateAll=(d,c,cfg)=>fireAssets(d,c,{...cfg,inc:{demand:true,td:true,us:false,tw:false},exEF:false,exShort:false,shortAmt:0}).depRate;   // 全部存款的加權利率（現金目標用）
const goalRatePct=(cfg,depR,place)=>{ if(place==='invest'){ let n=cfg.cons-cfg.cost; if(n>0) n*=1-cfg.tax/100; return n; } return depR; };   // 目標預估用保守情境（名目）
const goalFV=(saved,sched,m,ratePct)=>{ const r=Math.pow(1+ratePct/100,1/12)-1; let b=saved; for(let i=1;i<=m;i++) b=b*(1+r)+((sched&&sched[i])||0); return b; };
function goalInfo(d,cfg,depR){   // 每個目標的狀態：ready 現在已可達成｜onTrack 到期前可達成｜short 預估不足｜nodate 未填日期｜due 已到期
  const plan=goalPlan(d,cfg), out={};
  plan.A.act.forEach(g=>{ const a=plan.A.al[g.id]||0, bud=g.budget||0, m=goalMonths(g), pl=g.place==='invest'?'invest':'cash', p=plan.parts.find(x=>x.id===g.id); let st,lack=0;
    if(m==null&&g.date) st='due'; else if(bud>0&&a>=bud) st='ready'; else if(m==null) st='nodate';   // 日期已過一律是「已到期」（即使金額夠，也要提醒支付）
    else { lack=Math.max(0,bud-goalFV(a,p?p.sched:[],m,goalRatePct(cfg,depR,pl))); st=lack>bud*0.005?'short':'onTrack'; }
    out[g.id]={al:a,m,place:pl,st,lack:Math.round(lack)}; });
  return {info:out,plan};
}
function simMonths(start,target,monthly,ret,maxM=1200){   // 複利試算：幾個月後達標（null = 100 年內達不到）
  if(start>=target) return 0; let b=start; const r=ret/1200;
  for(let i=1;i<=maxM;i++){ b=b*(1+r)+monthly; if(b>=target) return i; }
  return null;
}
const addMonths=n=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth()+n,1);};
const fmtDur=n=>`${Math.floor(n/12)} 年 ${n%12} 個月`;
const ageAt=(d,date)=>{const b=d.profile&&d.profile.birth; if(!b) return null; return Math.floor((date-new Date(b))/31557600000);};
// FIRE 假設（皆可在「FIRE 設定」調整；舊資料沒有這些欄位時自動套用預設）
const FIRE_DEF={cons:3,opt:7,infl:2,cost:0.3,tax:10,swr:4,exEF:false,shortAmt:0,scen:'mid',noBonus:false,inc:{demand:false,td:true,us:true,tw:true}};   // 預設：活存不計入；定存、股票計入（已自行勾選過的人維持原設定）
const FIRE_ASSETS=[['demand','活存'],['td','定存'],['us','美股'],['tw','台股']];   // 活存 = 一般活存 + 高利活存
const SCEN=[['cons','保守'],['mid','中性'],['opt','樂觀']];
const fireCfg=d=>{const f=d.fire||{};return {...FIRE_DEF,...f,inc:{...FIRE_DEF.inc,...(f.inc||{})},mid:d.fireRet==null?5:d.fireRet};};
// 實質報酬率 =（名目報酬 − 投資成本，賺錢的部分再扣稅費）後，再扣除通膨
const realRet=(nom,cfg)=>{let n=nom-cfg.cost; if(n>0) n*=1-cfg.tax/100; return ((1+n/100)/(1+cfg.infl/100)-1)*100;};
function fireAssets(d,c,cfg){   // 計入 FIRE 的資產，分成「存款」與「股票」兩個口袋；存款利率取自銀行帳戶的利率（加權平均）
  let dep=0,int=0,ef=0,noRate=0;
  d.accounts.forEach(a=>[['demand','demand'],['fixed','td']].forEach(([k,ik])=>{
    if(!cfg.inc[ik]) return; const v=a[k]||0, m=(a.m&&a.m[k])||{}, r=m.rate||0, cap=m.cap||0;
    dep+=v; int+=(cap>0?Math.min(v,cap):v)*r/100; if(m.ef) ef+=v; if(v>0&&!(r>0)) noRate+=v; }));
  const stk=(cfg.inc.us?c.us:0)+(cfg.inc.tw?c.tw:0), depRate=dep>0?int/dep*100:0;
  const depOn=!!(cfg.inc.demand||cfg.inc.td);   // 沒有計入活存或定存時，「排除項目」不適用
  const exEF=cfg.exEF&&depOn?Math.min(ef,dep):0; let d1=dep-exEF, s1=stk, d2=d1, s2=s1;   // d1/s1：顯示用（未來基金全數排除）；d2/s2：試算起點（有日期的目標資金留在裡面）
  const mkTake=(get,set)=>amt=>{ let [dd,ss]=get(); const a=Math.min(amt,dd); dd-=a; const b=Math.min(amt-a,ss); ss-=b; set(dd,ss); return a+b; };   // 排除金額先從存款扣、不夠再扣股票
  const take=mkTake(()=>[d1,s1],(a,b)=>{d1=a;s1=b;}), take2=mkTake(()=>[d2,s2],(a,b)=>{d2=a;s2=b;});
  const gpl=goalPlan(d,cfg);
  const dIn=!!cfg.inc.demand;   // 未來基金 = 出金帳戶的活存：FIRE 有計入活存時才要從資產扣掉；沒計入時它本來就不在 FIRE 資產裡
  const exFund=dIn?take(gpl.pool):0; if(dIn) take2(gpl.exSaved); else d2+=Math.max(0,gpl.pool-gpl.exSaved);   // 有預計使用時間的目標資金，另外放進試算的口袋
  const useShort=cfg.exShort!=null?cfg.exShort:(cfg.shortAmt||0)>0;   // 舊資料：有填金額就視為要排除
  const short=useShort&&depOn?take(Math.max(0,cfg.shortAmt||0)):0; if(useShort&&depOn) take2(Math.max(0,cfg.shortAmt||0));
  return {gross:dep+stk,exEF,exFund,short,dep:d1,stk:s1,sdep:d2,sstk:s2,parts:gpl.parts,gpl,depOn,depRate,noRate,total:d1+s1};

function fireCalc(d,c,o={}){   // 雙軌 FIRE：Lean（必要開銷）/ Real（含娛樂與旅遊）；目標 = 年支出 ÷ 安全提領率，以「今日幣值」計算

  if(isObj(ours)&&isObj(theirs)){
    const b=isObj(base)?base:{}, out={};
    new Set([...Object.keys(ours),...Object.keys(theirs)]).forEach(k=>{const v=mergeVal(b[k],ours[k],theirs[k]); if(v!==undefined) out[k]=v;});

async function commitTxn(t,ref,ctx,sent){   // 交易內：雲端沒被別人改過 → 直接寫；改過 → 先合併再寫（rev 遞增）
  const snap=await t.get(ref), json=JSON.stringify(sent);
  if(!snap.exists){ t.set(ref,{json,rev:1}); return {rev:1,raw:json,merged:null}; }
  const rr=snap.data().rev||0, rraw=snap.data().json;
  if(typeof rraw!=='string') throw {code:'invalid-remote'};
  if(rraw===ctx.baseRaw){ t.set(ref,{json,rev:rr+1}); return {rev:rr+1,raw:json,merged:null}; }
  const rm=migrate(JSON.parse(rraw)); if(!rm) throw {code:'incompatible'};
  const merged=mergeVal(ctx.baseState,sent,rm), mj=JSON.stringify(merged);
  t.set(ref,{json:mj,rev:rr+1}); return {rev:rr+1,raw:mj,merged};
}
function planRemote(ctx,raw,cur,busy){   // 收到雲端快照：忽略（已知版本 / 自己的回音）、套用、或與本機未存變更合併
  if(raw===ctx.baseRaw) return {act:'ignore'};
  let st; try{ st=JSON.parse(raw); }catch(e){ return {act:'block',st:null}; }
  const mg=migrate(st); if(!mg) return {act:'block',st};

function SwipeLeft({open,onOpen,onClose,onTap,actions,children}) {
  const st=useRef(null), W=actions.length*72;
  const down=e=>{st.current={x:e.clientX,y:e.clientY};};
  const up=e=>{
    const sx=st.current; st.current=null; if(!sx) return;
    const dX=e.clientX-sx.x; if(Math.abs(e.clientY-sx.y)>30) return;
    if(dX<-40) onOpen(); else if(dX>40||(open&&Math.abs(dX)<5)) onClose(); else if(!open&&onTap&&Math.abs(dX)<5) onTap();
  };
  return (<div className="relative overflow-hidden border-b-[0.5px] border-neutral-300" style={{touchAction:'pan-y'}}>
    <div className="absolute right-0 top-0 bottom-0 flex">{actions.map(a=><button key={a.l} onClick={()=>{onClose();a.fn();}} aria-label={a.l} className={`w-[72px] text-white text-xs font-medium flex items-center justify-center ${a.c}`}>{a.icon?<Ic n={a.icon} s={18}/>:a.l}</button>)}</div>
    <div className="relative bg-white transition-transform duration-200" style={{transform:`translateX(${open?-W:0}px)`}} onPointerDown={down} onPointerUp={up} onPointerCancel={()=>{st.current=null;}}>{children}</div>
  </div>);
}

function SwipeRow({open,onOpen,onClose,onEdit,children}) {
  const st=useRef(null);
  const dx=open==='r'?72:open==='l'?-72:0;
  const down=e=>{st.current={x:e.clientX,y:e.clientY};};
  const up=e=>{
    const s=st.current; st.current=null; if(!s) return;
    const dX=e.clientX-s.x; if(Math.abs(e.clientY-s.y)>30) return;
    if(dX>40) (open==='l'?onClose():onOpen('r'));
    else if(dX<-40) (open==='r'?onClose():onOpen('l'));
    else if(open&&Math.abs(dX)<5) onClose();
  };
  const eb="absolute top-0 bottom-0 w-[72px] bg-blue-600 text-white text-xs font-medium";
  return (<div className="relative overflow-hidden border-b-[0.5px] border-neutral-300" style={{touchAction:'pan-y'}}>
    <button onClick={onEdit} aria-label="編輯" className={eb+' left-0 flex items-center justify-center'}><Ic n="pen-line" s={18}/></button>
    <button onClick={onEdit} aria-label="編輯" className={eb+' right-0 flex items-center justify-center'}><Ic n="pen-line" s={18}/></button>
    <div className="relative bg-white transition-transform duration-200 select-none" style={{transform:`translateX(${dx}px)`}} onPointerDown={down} onPointerUp={up} onPointerCancel={()=>{st.current=null;}}>{children}</div>
  </div>);
}

  const toggleHide=()=>setHide(h=>{const n=!h;try{localStorage.setItem('hide',n?'1':'0');}catch(e){}return n;});

  // dirty.current = 本機有尚未確認寫入雲端的變更；只有寫入成功（且之後沒有新變更）才會清除
  const flush=()=>{
    if(!CONFIGURED||!ready||!docRef.current||inflight.current||!dirty.current) return;
    if(typeof navigator!=='undefined'&&navigator.onLine===false){ setSync(OFFLINE_T,'offline'); return; }
    clearTimeout(retryT.current);
    const sent=dRef.current, ref=docRef.current;
    inflight.current=true; setSync('儲存中…','saving');
    db.runTransaction(t=>commitTxn(t,ref,ctx.current,sent)).then(res=>{
      inflight.current=false; retries.current=0;
      ctx.current={baseRaw:res.raw,baseState:res.merged||sent};
      const cur=dRef.current;
      if(res.merged){   // 別的裝置同時改過：合併結果套回本機，保留寫入期間你又改的部分
        if(cur===sent){ skip.current=true; dirty.current=false; setD(res.merged); setSync('已同步','ok'); return; }
        setD(mergeVal(sent,cur,res.merged)); return;
      }
      if(cur===sent){ dirty.current=false; setSync('已同步','ok'); }
      else { clearTimeout(timer.current); timer.current=setTimeout(()=>flushRef.current(),50); }   // 寫入期間又有修改 → 接著再寫
    }).catch(err=>{
      inflight.current=false; const code=(err&&(err.code||err.message))||'unknown';
      if(code==='incompatible'||code==='invalid-remote'){ setBlocked('雲端資料版本不相容或已損毀。為避免覆蓋你的資料，App 已停止讀寫雲端。'); setReady(false); setSync('資料版本不相容，已停止讀寫','error'); return; }
      if((typeof navigator!=='undefined'&&navigator.onLine===false)||code==='unavailable') setSync(OFFLINE_T,'offline');
      else setSync(`儲存失敗（${code}）・點此重試`,'error');
      if(code==='permission-denied'||code==='unauthenticated') return;   // 重試也不會成功
      clearTimeout(retryT.current); retryT.current=setTimeout(()=>flushRef.current(),Math.min(30000,2000*Math.pow(2,retries.current++)));   // 自動重試：2、4、8…最多 30 秒
    });
  };
  flushRef.current=flush;
  // 建立全新雲端文件：用交易「確認不存在才建立」，成功後才開放編輯與同步；失敗不假裝已同步，並會重試
  const initDoc=()=>{
    const ref=docRef.current; if(!ref||loaded.current||initing.current) return;
    initPending.current=true;
    if(typeof navigator!=='undefined'&&navigator.onLine===false){ setSync('離線・連線後會自動建立雲端資料','offline'); return; }
    clearTimeout(retryT.current); initing.current=true; setSync('正在建立雲端資料…');
    const json=JSON.stringify(mockData);
    db.runTransaction(t=>t.get(ref).then(sn=>{ if(sn.exists) return 'exists'; t.set(ref,{json,rev:1}); return 'created'; }))
      .then(r=>{
        initing.current=false; if(docRef.current!==ref) return;
        initPending.current=false; initRetries.current=0;
        if(r==='exists'){ setSync('正在載入雲端資料…'); return; }   // 別處已先建立：不覆蓋，交給 onSnapshot 正常載入
        if(loaded.current) return;
        skip.current=true; setD(mockData); loaded.current=true; ctx.current={baseRaw:json,baseState:mockData}; setBlocked(''); setReady(true); setSync('已同步','ok');
      }).catch(e=>{
        initing.current=false; if(docRef.current!==ref) return;
        const code=(e&&(e.code||e.message))||'unknown';
        setSync(`初始化失敗（${code}）・點此重試`,'error');
        if(code==='permission-denied'||code==='unauthenticated') return;   // 重試也不會成功
        clearTimeout(retryT.current); retryT.current=setTimeout(()=>initRef.current(),Math.min(30000,2000*Math.pow(2,initRetries.current++)));
      });
  };
  initRef.current=initDoc;
  const retryNow=()=>{ clearTimeout(retryT.current); if(initPending.current&&!loaded.current){ initRetries.current=0; initRef.current(); return; } retries.current=0; flushRef.current(); };   // 手動重試

  // 監聽登入狀態：登入後讀取並即時監聽 users/{uid}/app/data
  useEffect(()=>{
    if(!CONFIGURED) return; let unsub=null;
    const off=auth.onAuthStateChanged(user=>{
      if(unsub){ unsub(); unsub=null; }
      clearTimeout(timer.current); clearTimeout(retryT.current);
      if(!user){ docRef.current=null; dirty.current=false; skip.current=false; inflight.current=false; loaded.current=false; retries.current=0; initing.current=false; initPending.current=false; initRetries.current=0; ctx.current={baseRaw:'',baseState:null}; setBlocked(''); setReady(false); setD(mockData); setAuthState('out'); setSync('尚未登入'); return; }
      setAuthState('in'); setSync('連線中…');
      docRef.current=db.collection('users').doc(user.uid).collection('app').doc('data');
      unsub=docRef.current.onSnapshot({includeMetadataChanges:true},snap=>{
        const block=msg=>{ setBlocked(msg); setReady(false); setSync('資料版本不相容，已停止讀寫','error'); };
        try{
          if(!snap.exists){
            if(snap.metadata.fromCache){ setSync('等待確認雲端資料…'); return; }   // 快取的「不存在」不可信，不初始化
            if(loaded.current) return;
            initRef.current(); return;   // 不在這裡先 setReady(true)：必須等建立成功
          }
          if(snap.metadata.fromCache){ setSync(dirty.current?OFFLINE_T:'離線・顯示的是本機快取','offline'); return; }
          const raw=snap.data().json;
          if(typeof raw!=='string') return block('雲端文件存在，但沒有可辨識的資料欄位。');
          if(!loaded.current){   // 第一次載入：可能需要升級資料格式
            const st=JSON.parse(raw), mg=migrate(st);
            if(!mg) return block(`雲端資料的版本（${st&&st.schema!=null?st.schema:'未知'}）與這個 App 不相容。為避免覆蓋你的資料，App 已停止讀寫雲端；請改用對應版本的 App。`);
            setBlocked(''); skip.current=true; setD(mg); loaded.current=true;
            if(mg===st){ ctx.current={baseRaw:raw,baseState:mg}; setReady(true); setSync('已同步','ok'); return; }
            const bk=docRef.current.parent.doc('backup_v'+(st.schema==null?'x':st.schema)), ref=docRef.current, up=JSON.stringify(mg), rev=(snap.data().rev||0)+1;
            ctx.current={baseRaw:raw,baseState:st}; setReady(false); setSync('正在備份並升級資料…');
            bk.get().then(b=>b.exists?null:bk.set({json:raw,savedAt:firebase.firestore.FieldValue.serverTimestamp()}))
              .then(()=>ref.set({json:up,rev}))
              .then(()=>{ ctx.current={baseRaw:up,baseState:mg}; setReady(true); setSync('已同步','ok'); })
              .catch(e=>block('無法備份原始資料（'+(e.code||e.message)+'），已停止寫入以保護雲端資料。'));
            return;
          }
          const busy=dirty.current||inflight.current, plan=planRemote(ctx.current,raw,dRef.current,busy);
          if(plan.act==='ignore'){ if(!busy) setSync('已同步','ok'); return; }
          if(plan.act==='block') return block('雲端資料的版本與這個 App 不相容。為避免覆蓋你的資料，App 已停止讀寫雲端。');
          ctx.current={baseRaw:raw,baseState:plan.theirs}; setBlocked('');
          if(plan.act==='merge'){ if(!eqJ(plan.merged,dRef.current)) setD(plan.merged); }   // 本機有未存變更：合併，不覆蓋
          else { skip.current=true; setD(plan.theirs); setSync('已同步','ok'); }
        }catch(e){ block('雲端資料無法解析（格式損毀或不相容）。為避免覆蓋你的資料，App 已停止讀寫雲端。'); }
      },err=>{ if(err.code==='unavailable') setSync('離線・無法連線到雲端','offline'); else setSync('同步失敗：'+err.code,'error'); });
    });
    return ()=>{ off(); unsub&&unsub(); clearTimeout(timer.current); clearTimeout(retryT.current); };
  },[]);
  // 資料變動 → 標記 dirty，0.5 秒後寫入；離線時只提示，連線後自動補寫
  useEffect(()=>{
    if(!ready||!docRef.current) return;
    if(skip.current){ skip.current=false; return; }
    dirty.current=true; seq.current++;
    const off=typeof navigator!=='undefined'&&navigator.onLine===false;
    setSync(off?OFFLINE_T:'儲存中…',off?'offline':'saving');
    clearTimeout(timer.current); timer.current=setTimeout(()=>flushRef.current(),500);
  },[d,ready]);
  useEffect(()=>{   // 連線狀態：恢復連線立即補寫；有未存變更時關閉頁面會提醒
    const on=()=>{ if(initPending.current&&!loaded.current){ initRetries.current=0; initRef.current(); } else if(dirty.current){ retries.current=0; flushRef.current(); } else if(ready) setSync('已同步','ok'); };
    const offl=()=>setSync(OFFLINE_T,'offline');
    const bye=e=>{ if(dirty.current){ e.preventDefault(); e.returnValue=''; } };
    window.addEventListener('online',on); window.addEventListener('offline',offl); window.addEventListener('beforeunload',bye);
    return ()=>{ window.removeEventListener('online',on); window.removeEventListener('offline',offl); window.removeEventListener('beforeunload',bye); };
  },[ready]);

  const fund=useMemo(()=>{const target=sumBy(d.goals.filter(g=>!g.done),g=>g.budget),saved=poolOf(d);return {target,saved,rate:target?Math.min(100,saved/target*100):0};},[d.goals,d.accounts,d.fundPayAcct]);
  const calc=useMemo(()=>calcAssets(d),[d]);
  const mom=useMemo(()=>{   // 較上月成長：與上個月的紀錄比較
    const pm=prevYM(curYM()), r0=d.history.find(x=>x.ym===pm), r=r0&&r0.kind!=='now'?r0:null;   // 上個月（1 月時為去年 12 月）；只用月底定義的快照，月中記錄的不拿來比
    const g=(cur,prev)=>(r&&prev)?(cur-prev)/prev*100:null;
    return {total:g(calc.total,r&&r.total),cash:g(calc.cash,r&&r.cash),fixed:g(calc.fixed,r&&r.fixed),invest:g(calc.invest,r&&r.invest)};
  },[d,calc]);
  const [snapLater,setSnapLater]=useState(false), [snapSheet,setSnapSheet]=useState(null);   // 稍後提醒只存在這次開啟 App 的畫面狀態，下次開啟會再提醒
  useEffect(()=>{ if(ready) setD(p=>archiveOldMonths(p)); },[ready,d.tx]);   // 月結：整理上月收支並清除明細

  const saveTx=(t0,id)=>{ const t={...t0,date:dateOrToday(t0.date)}; setD(p=>id?{...p,tx:p.tx.map(x=>x.id===id?{...x,...t}:x)}:{...p,tx:[...p.tx,{...t,id:uid()}]}); };
  const delTx=id=>setD(p=>({...p,tx:p.tx.filter(x=>x.id!==id)}));
  const recDone=useRef(false);
  useEffect(()=>{   // 定期定額：到期日提醒是否自動記載（餘額不足時不記載並提示）
    if(!ready||recDone.current) return; recDone.current=true;
    const ym=todayISO().slice(0,7), day=new Date().getDate();
    (d.recurring||[]).forEach(r=>{ if(r.lastYM!==ym&&day>=r.day){
      const ok=confirm(`定期定額提醒：本月 ${r.day} 號 ${r.ticker} 扣款，是否自動記載？`);
      setD(p=>{ let n=p;
        if(ok){ const rr=applyInvest(p,r,todayISO(),true); if(rr.err) setTimeout(()=>alert(`定期定額「${r.ticker}」未記載：${rr.err}`),0); else n=rr.p; }
        return {...n,recurring:n.recurring.map(x=>x.id===r.id?{...x,lastYM:ym}:x)}; }); } });
  },[ready]);
  const blank={date:todayISO(),type:'expense',cat:'餐飲',item:'',amt:0,note:''};

  return (<div className="relative w-full max-w-[393px] mx-auto min-h-screen bg-white overflow-hidden" style={{paddingTop:'env(safe-area-inset-top,0px)'}}>
    <header className="h-14 relative flex items-center justify-center mt-[19px]">
      <button onClick={()=>setProfile(true)} className="absolute left-4 w-6 h-6 flex flex-col justify-center gap-[6px] px-[3px]" aria-label="選單"><i className="block h-0.5 bg-black w-4"/><i className="block h-0.5 bg-black w-3.5"/><i className="block h-0.5 bg-black w-4"/></button>
      <h1 className="text-xl font-semibold leading-7 m-0">{d.profile&&d.profile.nick?d.profile.nick+'的錢錢💰':'錢錢💰'}</h1>
      <div onClick={()=>{if(sync.k==='error'||sync.k==='offline')retryNow();}} className={`absolute bottom-0 inset-x-0 text-center text-[10px] leading-3 ${sync.k==='error'?'text-red-500 cursor-pointer':sync.k==='offline'?'text-amber-500 cursor-pointer':'text-zinc-400'}`}>{sync.t}</div>
      <button onClick={toggleHide} aria-label={hide?'顯示數字':'隱藏數字'} className="absolute right-4 w-6 h-6 flex items-center justify-center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>{hide&&<path d="M3 3l18 18"/>}</svg>
      </button>
    </header>
    {menu&&<div className="fixed inset-0 z-30" onClick={()=>setMenu(false)}>
      <div className="absolute left-4 bg-white border border-neutral-200 rounded-lg shadow-lg p-2 text-sm" style={{top:'calc(env(safe-area-inset-top,0px) + 75px)'}} onClick={e=>e.stopPropagation()}>
        {CONFIGURED&&auth.currentUser&&<div className="px-3 py-1 text-xs text-zinc-500">{auth.currentUser.email}</div>}
        {CONFIGURED?<button onClick={()=>{setMenu(false);auth.signOut();}} className="px-3 py-2 w-full text-left font-medium">登出</button>:<div className="px-3 py-2 text-zinc-500">尚未設定 Firebase</div>}
      </div></div>}
    <nav className="flex gap-3 px-4 mt-3 overflow-x-auto no-sb">
      {TABS.map((t,i)=><button key={t} onClick={()=>setTab(i)} className={`px-3.5 py-1.5 rounded-[20px] text-sm font-medium leading-5 transition-colors inline-flex items-center justify-center ${tab===i?'bg-black text-white':'bg-neutral-100 text-black'}`} aria-label={t} aria-current={tab===i?'page':undefined}>{tab===i?<TT n={TAB_ICONS[i]} s={20}>{t}</TT>:<Ic n={TAB_ICONS[i]} s={20}/>}</button>)}
    </nav>
    {!ready&&<div className="py-24 text-center text-sm text-zinc-500">{sync.t.startsWith('初始化失敗')?<><div className="whitespace-normal px-8 leading-5">{sync.t.replace('・點此重試','')}<br/>尚未建立雲端資料，目前不開放編輯，也不會覆蓋任何資料。</div><div className="mt-3"><Btn onClick={retryNow}>重新嘗試</Btn></div></>:'載入中…'}</div>}
    <main key={tab} style={{animation:'fade .18s ease-out',display:ready?'block':'none'}}>
      {ready&&!snapLater&&needSnap(d,curYM())&&<div className="mx-4 mt-3 rounded-2xl border border-neutral-200 bg-neutral-50 p-3">
        <div className="text-sm font-semibold"><TT n="camera">該記錄本月資產快照了！</TT></div>
        <div className="text-xs text-zinc-500 leading-5 whitespace-normal mt-1">上個月的資產快照尚未完成，花一點時間更新帳戶餘額與投資資產，讓你的資產趨勢更完整。</div>
        <div className="flex gap-2 mt-2 flex-wrap"><Btn onClick={()=>setSnapSheet('eom')}>補登上月底資產</Btn><Btn onClick={()=>setSnapSheet('now')}>記錄目前資產</Btn><Btn gray onClick={()=>setSnapLater(true)}>稍後提醒</Btn></div></div>}
      {snapSheet&&<SnapSheet mode={snapSheet} d={d} setD={setD} onClose={()=>setSnapSheet(null)}/>}
      {tab===0&&<PageMy d={d} setD={setD} fund={fund} c={calc} mom={mom}/>}
      {tab===1&&<PageDetail d={d} setD={setD} c={calc} mom={mom}/>}
      {tab===2&&<CalcCtx.Provider value={true}><PageGoals d={d} setD={setD} fund={fund}/></CalcCtx.Provider>}
      {tab===3&&<PageLedger d={d} setD={setD} onEdit={t=>setTxForm({tx:t})} onInfo={setInfo}/>}
    </main>
    <button onClick={()=>ready&&setTxForm({})} aria-label="新增記帳" className="fixed z-20 w-12 h-12 rounded-full bg-black text-white text-2xl leading-none shadow-lg" style={{left:'max(16px,calc(50% - 180px))',bottom:'max(20px,env(safe-area-inset-bottom))'}}>+</button>
    {txForm&&<TxForm init={txForm.tx||blank} onSave={t=>saveTx(t,txForm.tx&&txForm.tx.id)} onDelete={txForm.tx?()=>delTx(txForm.tx.id):null} onClose={()=>setTxForm(null)}/>}
    {info&&<Sheet title="記帳詳情" onClose={()=>setInfo(null)}>
      <div className="text-sm leading-7">
        <div>日期：{fmtDate(info.date)}</div><div>分類：{info.cat}</div><div>項目：{info.item}</div><div>金額：{fmt(info.amt)}</div>
        <div className="whitespace-pre-wrap break-words">備註：{info.note||'（無）'}</div>
      </div>
    </Sheet>}
    {profile&&<Sheet title="個人資訊" onClose={()=>setProfile(false)}><div className="flex flex-col gap-3">
      <div><div className="text-xs text-zinc-500 mb-1">暱稱</div><Txt value={d.profile.nick} onChange={v=>setD(p=>({...p,profile:{...p.profile,nick:v}}))} ph="你的暱稱" className="h-10 w-full"/></div>
      <div><div className="text-xs text-zinc-500 mb-1">生日（用來計算 FIRE 達成年齡）</div><DateBox clearable value={d.profile.birth} onChange={v=>setD(p=>({...p,profile:{...p.profile,birth:v}}))}/></div>
      {CONFIGURED&&auth.currentUser&&<div className="text-xs text-zinc-500">{auth.currentUser.email}</div>}
      <button onClick={()=>{if(confirm('清空所有資料（帳戶、記帳、目標、持股…）？此動作無法復原。')){setD(p=>({...mockData,profile:p.profile}));setProfile(false);}}} className="h-11 rounded-lg border border-neutral-200 text-sm font-medium text-red-600">清空所有資料</button>
      {CONFIGURED&&<button onClick={()=>{setProfile(false);auth.signOut();}} className="h-11 rounded-lg border border-neutral-200 text-sm font-medium">登出</button>}
    </div></Sheet>}
    {calcCfg&&<CalcPad cfg={calcCfg} onClose={()=>setCalcCfg(null)}/>}
    {blocked&&<div className="fixed inset-0 z-[70] bg-white flex flex-col items-center justify-center gap-4 px-8 text-center">
      <div className="text-lg font-semibold">資料版本不相容</div>
      <p className="text-sm text-zinc-600 whitespace-normal leading-6 m-0">{blocked}</p>
      <p className="text-xs text-zinc-400 whitespace-normal m-0">你的雲端資料沒有被修改或覆蓋。</p>
      <div className="flex gap-3"><button onClick={()=>location.reload()} className="h-11 px-5 rounded-lg bg-black text-white text-sm font-medium">重新整理</button>{CONFIGURED&&<button onClick={()=>auth.signOut()} className="h-11 px-5 rounded-lg border border-neutral-200 text-sm font-medium">登出</button>}</div>
    </div>}
    {CONFIGURED&&authState==='out'&&<LoginScreen/>}
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
